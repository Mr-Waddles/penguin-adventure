<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#dff8ff"
  >

  <meta
    name="description"
    content="Penguin Adventure - a fun penguin adventure game"
  >

  <link rel="manifest" href="manifest.json">

  <link
    rel="stylesheet"
    href="style.css"
  >

  <title>Penguin Adventure</title>
</head>

<body>

  <div id="app">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header>

      <h1>🐧 Penguin Adventure</h1>

      <button id="friendsBtn">
        👥 Friends
      </button>

    </header>


    <!-- =====================================================
         MAIN MENU
         ===================================================== -->

    <main id="menu">

      <div class="panel">

        <h2>🐧 Penguin Adventure</h2>

        <p>
          Explore the ice, defeat enemies,
          battle bosses and play with friends!
        </p>

        <button
          class="big"
          data-screen="adventure"
        >
          ▶️ Start Adventure
        </button>

        <button
          class="big"
          data-screen="coop"
        >
          👥 Co-op
        </button>

        <button
          class="big"
          data-screen="pvp"
        >
          ⚔️ PVP
        </button>

        <button
          class="big"
          data-screen="creator"
        >
          🛠️ Level Creator
        </button>

        <button
          class="big"
          id="shopBtn"
        >
          🛍️ Penguin Shop
        </button>

        <p id="coins">
          Coins: 0
        </p>

      </div>

    </main>


    <!-- =====================================================
         FRIENDS PANEL
         ===================================================== -->

    <section
      id="friendsPanel"
      class="hidden"
    >

      <h2>👥 Friends</h2>

      <p>
        Online:
        <strong id="onlineCount">0</strong>
      </p>

      <div id="friendsList"></div>

      <button id="closeFriends">
        Close
      </button>

    </section>


    <!-- =====================================================
         GENERAL SCREEN
         ===================================================== -->

    <section
      id="screen"
      class="panel hidden"
    >
    </section>


    <!-- =====================================================
         GAME
         ===================================================== -->

    <section
      id="gameWrap"
      class="hidden"
    >

      <div id="hud">

        <span id="mode">
          Adventure
        </span>

        <span id="hp">
          ❤️ 5
        </span>

        <span id="boss">
        </span>

      </div>


      <canvas
        id="game"
        width="960"
        height="540"
      ></canvas>


      <!-- ===================================================
           MOBILE CONTROLS
           =================================================== -->

      <div id="controls">

        <button
          data-key="left"
          aria-label="Move left"
        >
          ◀️
        </button>

        <button
          data-key="right"
          aria-label="Move right"
        >
          ▶️
        </button>

        <button
          id="jump"
          aria-label="Jump"
        >
          ⬆️ Jump
        </button>

        <button
          id="punch"
          aria-label="Punch"
        >
          👊 Punch
        </button>

        <button
          id="gust"
          aria-label="Gust"
        >
          💨 Gust
        </button>

        <button
          id="leaveGame"
          aria-label="Leave game"
        >
          🚪 Leave
        </button>

      </div>


      <!-- ===================================================
           PARTY CHAT
           =================================================== -->

      <div id="chat">

        <div id="messages"></div>

        <input
          id="chatInput"
          type="text"
          maxlength="120"
          placeholder="Party chat..."
          autocomplete="off"
        >

        <button id="sendChat">
          Send
        </button>

      </div>

    </section>


    <!-- =====================================================
         TOAST NOTIFICATIONS
         ===================================================== -->

    <div id="toast"></div>

  </div>


  <!-- =======================================================
       GAME JAVASCRIPT
       ======================================================= -->

  <script src="game.js"></script>

</body>
</html>
